<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Uhaus</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uhaus">
<meta name="theme-color" content="#F7F3EB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: phone-first hotel front desk. Ivory paper ground, navy ink, terracotta for the one action that matters on each screen */
:root{
  --ivory:#F7F3EB; --paper:#FFFDF9; --paper2:#F1EADF; --sand:#E8DDCC; --line:#E4DACB;
  --navy:#122D43; --navy2:#2C4A63; --navy-soft:#DCE4EC; --terra:#A65B49; --terra-dark:#8B4636; --terra-soft:#F3E2DB;
  --ink:#1A2733; --muted:#6F7782;
  --ok:#2F6B4F; --ok-bg:#E2EDE4; --warn:#8A5A14; --warn-bg:#F6E8CC; --bad:#9B3B2B; --bad-bg:#F6DED8;
  --display:'Mitr','IBM Plex Sans Thai Looped',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --r:18px; --tab:66px;
  --shadow:0 1px 2px rgba(18,45,67,.05),0 8px 24px -12px rgba(18,45,67,.12);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.3;color:var(--navy)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(247,243,235,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--ivory)}
header.top h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
header.top h1 .paw{width:18px;height:18px;color:var(--terra);flex:none}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--navy)}
.iconbtn svg{width:20px;height:20px}
main{padding:6px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:780px;margin:0 auto}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy);font-weight:600}
nav.tabs button.on::after{content:"";position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:var(--terra)}

/* Surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:active{background:var(--paper2)}
.row .av{width:40px;height:40px;border-radius:14px;background:var(--paper2);display:grid;place-items:center;flex:none;color:var(--navy)}
.row .av svg{width:24px;height:24px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.sec h2{font-size:17px}
.sec .lnk{color:var(--terra);font-size:14px;background:none;border:0;cursor:pointer;padding:0;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:30px;height:30px;color:var(--sand)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.p-pend{background:var(--warn-bg);color:var(--warn)}
.p-resv{background:var(--navy-soft);color:var(--navy)}
.p-in{background:var(--navy);color:var(--ivory)}
.p-out{background:var(--paper2);color:var(--muted)}
.p-cxl{background:var(--bad-bg);color:var(--bad)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-ch{background:var(--paper2);color:var(--navy2);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .l svg{width:16px;height:16px;color:var(--terra)}
.kpi .v{font-family:var(--display);font-size:26px;line-height:1.25;color:var(--navy)}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--body)}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:var(--ivory);position:relative;overflow:hidden}
.kpi.hero .l,.kpi.hero .v small{color:#C9D4DE}
.kpi.hero .v{color:var(--ivory)}
.kpi.hero::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;opacity:.12;background:var(--paw-ivory) center/contain no-repeat;transform:rotate(-18deg)}
.kpi .v.sm{font-size:20px}

.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--paper2);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;text-align:center}
.btn.pri{background:var(--navy);color:var(--ivory)}
.btn.red{background:var(--terra);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 150px}
.seg{display:flex;background:var(--paper2);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:11px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(18,45,67,.1)}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:16px}
.alert{border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.5}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--paper2);color:var(--ink)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 18px);z-index:25;
  border:0;background:var(--terra);color:#fff;border-radius:999px;height:56px;padding:0 22px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(166,91,73,.6);cursor:pointer;font-size:15px}
.fab svg{width:22px;height:22px}
.hello{display:flex;align-items:center;gap:12px}
.hello .d{font-family:var(--display);font-size:15px;color:var(--navy)}

/* Forms */
.form{display:flex;flex-direction:column;gap:13px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px;min-height:48px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy2);outline:none}
.f textarea{min-height:80px;resize:vertical}
.f input[type=date]{-webkit-appearance:none;appearance:none}
.f input:disabled{background:var(--paper2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.chk{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--terra);flex:none;margin:0}
.f label.chk{display:flex;margin:0;color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--navy)}
.price{background:var(--paper2);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.price .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.price .ln.ok{color:var(--ok)}
.price .ln.terra{color:var(--terra-dark)}
.price .tot{font-family:var(--display);font-size:22px;color:var(--navy);border-top:1px dashed var(--sand);padding-top:7px;margin-top:4px}
.picker{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:250px;overflow-y:auto;background:var(--paper)}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--navy2);border-radius:14px;background:var(--paper)}
.picked .main{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(18,45,67,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ivory);width:100%;max-width:640px;max-height:94%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:88%}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--sand);margin:8px auto 0}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.sheet .hd h2{font-size:19px;flex:1;min-width:0}
.sheet .bd>*{flex-shrink:0}
.sheet .bd{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}

/* Room grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table.occ{border-collapse:separate;border-spacing:0;font-size:12px}
table.occ th,table.occ td{height:38px;min-width:42px;width:42px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
table.occ thead th{position:sticky;top:0;background:var(--paper);z-index:2;font-weight:500;color:var(--muted);line-height:1.15;height:46px}
table.occ thead th b{color:var(--navy);font-size:13px}
table.occ thead th.wk b,table.occ thead th.wk{color:var(--terra)}
table.occ thead th.td{background:var(--navy);color:var(--ivory)}
table.occ thead th.td b{color:var(--ivory)}
table.occ th.rn{position:sticky;left:0;z-index:3;background:var(--paper);text-align:left;padding:0 10px;min-width:110px;width:110px;max-width:110px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.occ thead th.rn{z-index:4}
table.occ tr.zone th{position:sticky;left:0;background:var(--paper2);text-align:left;padding:6px 10px;font-family:var(--display);font-weight:500;color:var(--navy);height:34px}
table.occ tr.zone th span{display:inline-flex;align-items:center;gap:6px}
table.occ tr.zone svg{width:18px;height:18px;color:var(--terra)}
table.occ td{cursor:pointer}
table.occ td.b-pend{background:repeating-linear-gradient(-45deg,var(--warn-bg),var(--warn-bg) 5px,#EEDDBB 5px,#EEDDBB 7px);color:var(--warn)}
table.occ td.b-resv{background:var(--navy-soft);color:var(--navy)}
table.occ td.b-in{background:var(--navy);color:var(--ivory)}
table.occ td.b-out{background:var(--paper2);color:var(--muted)}
table.occ td.blk{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 4px,var(--line) 4px,var(--line) 6px)}
table.occ td .lb{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:visible;text-align:left;padding-left:5px;position:relative;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}

/* Login */
.login{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));
  background:var(--ivory) var(--paw-pattern) repeat;background-size:140px}
.login .box{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:26px 22px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:360px}
.login img{width:210px;max-width:80%}
.login h2{font-size:17px}
.pin{display:flex;gap:12px}
.pin span{width:15px;height:15px;border-radius:50%;border:2px solid var(--navy)}
.pin span.on{background:var(--terra);border-color:var(--terra)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:var(--paper2);font-family:var(--display);font-size:24px;cursor:pointer;color:var(--navy)}
.pad button:active{background:var(--sand)}
.pad button.sm{font-family:var(--body);font-size:14px;background:none;color:var(--muted)}
.pad button.go{color:var(--terra);font-weight:600}

/* Receipt (white paper for print) */
.paper{background:#fff;color:#1A2733;width:560px;padding:30px 32px;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;line-height:1.5;position:relative}
.paperwrap{overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.paper .hdr{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid #122D43}
.paper .hdr img{width:150px}
.paper .co{text-align:right;font-size:12px;color:#3A4651}
.paper .co b{font-size:14px;display:block;color:#122D43}
.paper .ttl{text-align:center;margin:16px 0 10px;font-family:'Mitr',sans-serif;font-size:21px;color:#122D43}
.paper .ttl small{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:11px;letter-spacing:.2em;color:#A65B49}
.paper .meta{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin-bottom:10px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0}
.paper th{background:#F1EADF;color:#122D43;font-weight:600;padding:7px 8px;text-align:left;font-size:12px}
.paper td{padding:7px 8px;border-bottom:1px solid #EAE3D7;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.paper .sum{margin-left:auto;width:270px}
.paper .sum div{display:flex;justify-content:space-between;padding:2px 0}
.paper .sum .g{font-weight:600;font-size:15px;color:#122D43;border-top:1.5px solid #122D43;margin-top:4px;padding-top:6px}
.paper .words{background:#F7F3EB;padding:7px 10px;border-radius:8px;margin:10px 0;text-align:center;color:#122D43}
.paper .pay{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:12px}
.paper .sig{text-align:center;margin-top:28px;font-size:12px}
.paper .sig .ln{border-top:1px dotted #555;width:180px;margin:0 auto 4px;padding-top:4px}
.paper .foot{margin-top:18px;padding-top:10px;border-top:1px solid #EAE3D7;text-align:center;font-size:11px;color:#A65B49;letter-spacing:.04em}
.paper .void{color:#9B3B2B;border:2px solid #9B3B2B;display:inline-block;padding:2px 10px;font-weight:600;transform:rotate(-6deg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 88px);z-index:90;background:var(--navy);color:var(--ivory);padding:11px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 24px -8px rgba(18,45,67,.5)}
.busy{position:fixed;inset:0;z-index:80;background:rgba(18,45,67,.15);display:grid;place-items:center}
.busy div{background:var(--paper);padding:14px 20px;border-radius:16px;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;color:var(--navy)}
.busy svg{width:20px;height:20px;color:var(--terra);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy svg{animation:none}}
.thumb{max-width:100%;border-radius:14px;border:1px solid var(--line)}
.vx{display:flex;flex-wrap:wrap;gap:6px}
.msgbox{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.6;user-select:text;-webkit-user-select:text}
.hold{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.hold svg{width:22px;height:22px;flex:none}
.hold b{font-family:var(--display);font-weight:500;font-size:18px}
.peak{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;align-items:end}
.peak .iconbtn{width:44px;height:48px}
@media(max-width:420px){.peak{grid-template-columns:1fr 1fr auto}.peak .f:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>
<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg><span>กำลังบันทึก…</span></div></div>

<script>

/* ====================== Utilities ====================== */

let TOKEN = store('uh_token') || '';
async function api(action, payload, opts = {}) {
  if (!opts.silent) busy(true, opts.text);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: TOKEN, payload, pin: payload && payload.pin }) });
    const j = await res.json();
    if (!j.ok) {
      if (j.code === 'auth') { TOKEN = ''; store('uh_token', null); S.user = null; closeAllSheets(); render(); }
      throw new Error(j.error || 'เกิดข้อผิดพลาด');
    }
    return j.data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง');

  const pending = S.bookings.filter(b => effStatus(b) === 'pending').sort((a, b) => a.holdUntil - b.holdUntil);
  const expired = S.bookings.filter(b => effStatus(b) === 'expired' && b.checkIn >= t).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  const inHouse = S.bookings.filter(b => b.status === 'in');
  const arrivals = S.bookings.filter(b => b.status === 'reserved' && b.checkIn <= t).sort((a, b) => a.checkIn.localeCompare(b.checkIn));
  const departures = inHouse.filter(b => b.checkOut <= t).sort((a, b) => a.checkOut.localeCompare(b.checkOut));
  const staying = inHouse.filter(b => b.checkOut > t).sort((a, b) => a.checkOut.localeCompare(b.checkOut));
  const freeTonight = zone => activeRooms().filter(r => r.zone === zone && !r.combines && !conflictsFor(r.id, t, addDays(t, 1)).length).length;
  const totalZone = zone => activeRooms().filter(r => r.zone === zone && !r.combines).length;
  const petsIn = inHouse.reduce((n, b) => n + petIdsOf(b).length, 0);
  const groomToday = S.grooming.filter(g => g.date === t && g.status === 'booked');
  const d = parseISO(t);
  const sec = (title, list, empty) => `<div class="sec"><h2>${title}</h2></div><div class="list">${list.length ? list.map(bookingRow).join('') : emptyBox(empty)}</div>`;
  main.innerHTML = `
    <div class="hello"><div class="d">${['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'][d.getUTCDay()]}ที่ ${thDateLong(t)}</div><span class="muted small">· ${esc(S.user.name)}</span></div>
    <div class="kpis">
      <div class="kpi hero"><div class="l">น้องๆ ในร้านตอนนี้</div><div class="v num">${petsIn} <small>ตัว · ${inHouse.length} ห้อง</small></div></div>
      ${ZONES.map(z => `<div class="kpi"><div class="l">${zoneIcon(z)}ว่างคืนนี้ · ${z}</div><div class="v num">${freeTonight(z)}<small> / ${totalZone(z)}</small></div></div>`).join('')}
    </div>
    ${pending.length ? sec(`รอโอนเงิน (${pending.length})`, pending, '') : ''}
    ${sec(`รอเช็กอิน (${arrivals.length})`, arrivals, 'ไม่มีน้องเข้าพักวันนี้')}
    ${sec(`ครบกำหนดเช็กเอาท์ (${departures.length})`, departures, 'ไม่มีน้องกลับบ้านวันนี้')}
    ${groomToday.length ? `<div class="sec"><h2>นัดอาบน้ำตัดขนวันนี้</h2></div><div class="list">${groomToday.map(groomRow).join('')}</div>` : ''}
    ${sec(`เข้าพักอยู่ (${staying.length})`, staying, 'ไม่มีรายการอื่น')}
    ${expired.length ? sec(`หมดเวลาชำระ ติดตามลูกค้า (${expired.length})`, expired.slice(0, 10), '') : ''}
    <button class="fab" id="fab">${ICON.plus}จองห้อง</button>`;
  bindRows(main);
  $('#fab').onclick = () => openBookingForm({ checkIn: t, checkOut: addDays(t, 1) });
}
function bookingRow(b) {
  const c = cust(b.customerId) || {}, r = room(b.roomId) || {}, st = effStatus(b), t = today();
  let flag = '';
  if (st === 'pending') flag = `<span class="pill p-pend" data-hold="${b.holdUntil}">${ICON.clock.replace('<svg', '<svg width="13" height="13"')}เหลือ ${holdLeftMin(b)} นาที</span>`;
  else if (b.status === 'reserved' && b.checkIn < t) flag = '<span class="pill p-warn">ยังไม่มา</span>';
  else if (b.status === 'in' && b.checkOut < t) flag = '<span class="pill p-warn">เกินกำหนดออก</span>';
  const bal = (b.status === 'reserved' || b.status === 'in') ? balanceOf(b) : 0;
  return `<div class="row" data-bk="${b.id}">${petAvatar(b)}<div class="main"><div class="t">${esc(petNames(b) || '-')} · ${esc(r.name || b.roomId)}</div>
    <div class="s">${esc(c.name || '')} · ${thDate(b.checkIn, false)} – ${thDate(b.checkOut, false)} (${b.nights} คืน)${groupOf(b).length > 1 ? ' · จองรวม ' + groupOf(b).length + ' ห้อง' : ''}</div></div>
    <div class="end">${flag || pillStatus(b)}<span class="small num ${bal > 0 ? '' : 'muted'}" ${bal > 0 ? 'style="color:var(--terra-dark);font-weight:600"' : ''}>${bal > 0 ? 'ค้าง ' + money(bal) : money(b.total)} ฿</span></div></div>`;
}
function groomRow(g) {
  const c = cust(g.customerId) || {}, p = pet(g.petId) || {};

function bindRows(root) {
  $$('[data-bk]', root).forEach(el => el.onclick = () => openBooking(el.dataset.bk));

/* ====================== Room grid ====================== */
function vRooms(main) {
  const DAYS = 14, start = S.gridStart, t = today();
  const dates = Array.from({ length: DAYS }, (_, i) => addDays(start, i));
  const rooms = activeRooms().filter(r => S.gridZone === 'all' || r.zone === S.gridZone);
  const end = addDays(start, DAYS);
  const bks = S.bookings.filter(b => (isLive(b) || b.status === 'out') && b.checkIn < end && start < b.checkOut);
  const cell = {};
  bks.forEach(b => {
    const br = room(b.roomId); if (!br) return;
    const phys = physical(br);
    const last = b.status === 'out' && b.actualCheckOut ? b.actualCheckOut : b.checkOut;
    S.rooms.forEach(r => {
      const own = r.id === b.roomId;
      if (!own && !physical(r).some(x => phys.includes(x))) return;
      for (let d = b.checkIn; d < last; d = addDays(d, 1)) {
        if (d < start || d >= end) continue;
        const k = r.id + '|' + d;
        if (!cell[k] || own) cell[k] = { b, own };
      }
    });
  });
  const head = `<tr><th class="rn">ห้อง</th>${dates.map(d => `<th class="${d === t ? 'td' : ''} ${dow(d) === 0 || dow(d) === 6 ? 'wk' : ''}">${TH_D[dow(d)]}<br><b class="num">${parseISO(d).getUTCDate()}</b></th>`).join('')}</tr>`;
  let body = '';
  ZONES.forEach(z => {
    const rs = rooms.filter(r => r.zone === z); if (!rs.length) return;
    body += `<tr class="zone"><th colspan="${DAYS + 1}"><span>${zoneIcon(z)}${esc(ZONE_TH[z])}</span></th></tr>`;
    rs.forEach(r => {
      body += `<tr><th class="rn" title="${esc(r.name)}">${esc(r.name.replace(/ \(.+\)/, ''))}</th>` + dates.map(d => {
        const c = cell[r.id + '|' + d];
        if (!c) return `<td data-free="${r.id}|${d}"></td>`;
        if (!c.own) return `<td class="blk" data-cell="${c.b.id}"></td>`;
        const st = effStatus(c.b);
        const cls = st === 'in' ? 'b-in' : st === 'out' ? 'b-out' : st === 'pending' ? 'b-pend' : 'b-resv';
        const label = (d === c.b.checkIn || d === start) ? `<span class="lb">${esc((petNames(c.b) || '').split(',')[0].slice(0, 8))}</span>` : '';
        return `<td class="${cls}" data-cell="${c.b.id}">${label}</td>`;
      }).join('') + '</tr>';
    });
  });
  main.innerHTML = `
    <div class="seg" id="zone">${[['all', 'ทั้งหมด'], ...ZONES.map(z => [z, z])].map(z => `<button data-z="${z[0]}" class="${S.gridZone === z[0] ? 'on' : ''}">${z[1]}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="iconbtn" id="prev" aria-label="ก่อนหน้า">${ICON.left}</button>
      <div style="flex:1;text-align:center;font-family:var(--display);color:var(--navy)">${thDate(start)} – ${thDate(addDays(start, DAYS - 1))}</div>
      <button class="iconbtn" id="next" aria-label="ถัดไป">${ICON.right}</button>
      <button class="btn ghost" id="tdy" style="min-height:40px;padding:6px 14px">วันนี้</button>
    </div>
    <div class="legend"><span><i style="background:var(--warn-bg)"></i>รอโอน</span><span><i style="background:var(--navy-soft)"></i>ชำระแล้ว</span><span><i style="background:var(--navy)"></i>เข้าพักอยู่</span><span><i style="background:var(--paper2)"></i>ออกแล้ว</span><span><i style="background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 3px,var(--line) 3px,var(--line) 5px)"></i>ใช้ร่วม Connecting</span></div>
    <div class="gridwrap"><table class="occ num"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="muted small">แตะช่องว่างเพื่อจองห้องนั้น · แตะช่องที่มีสีเพื่อดูการจอง</div>
    <button class="fab" id="fab">${ICON.plus}จองห้อง</button>`;
  $$('#zone button').forEach(b => b.onclick = () => { S.gridZone = b.dataset.z; render(); });
  $('#prev').onclick = () => { S.gridStart = addDays(S.gridStart, -7); render(); };
  $('#next').onclick = () => { S.gridStart = addDays(S.gridStart, 7); render(); };
  $('#tdy').onclick = () => { S.gridStart = today(); render(); };
  $$('td[data-free]').forEach(td => td.onclick = () => { const [rid, d] = td.dataset.free.split('|'); openBookingForm({ roomId: rid, checkIn: d, checkOut: addDays(d, 1) }); });
  $$('td[data-cell]').forEach(td => td.onclick = () => openBooking(td.dataset.cell));
  $('#fab').onclick = () => openBookingForm({ checkIn: today(), checkOut: addDays(today(), 1) });
}

/* ====================== Bookings list ====================== */
function vBookings(main) {
  const t = today(), q = S.bkQ.trim().toLowerCase();
  let list = S.bookings.slice();
  const f = S.bkFilter;
  if (f === 'pending') list = list.filter(b => effStatus(b) === 'pending' || (effStatus(b) === 'expired' && b.checkIn >= t)).sort((a, b) => b.holdUntil - a.holdUntil);
  else if (f === 'reserved') list = list.filter(b => b.status === 'reserved').sort((a, b) => a.checkIn.localeCompare(b.checkIn));
  else if (f === 'in') list = list.filter(b => b.status === 'in').sort((a, b) => a.checkOut.localeCompare(b.checkOut));
  else list = list.sort((a, b) => b.checkIn.localeCompare(a.checkIn));
  if (q) list = list.filter(b => ((cust(b.customerId) || {}).name + ' ' + ((cust(b.customerId) || {}).phone || '') + ' ' + petNames(b) + ' ' + ((room(b.roomId) || {}).name || '')).toLowerCase().includes(q));
  const n = k => S.bookings.filter(b => k === 'pending' ? effStatus(b) === 'pending' : b.status === k).length;
  main.innerHTML = `
    <div class="seg" id="bf">${[['pending', `รอโอน${n('pending') ? ' ' + n('pending') : ''}`], ['reserved', 'ชำระแล้ว'], ['in', 'เข้าพักอยู่'], ['all', 'ทั้งหมด']].map(x => `<button data-f="${x[0]}" class="${f === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="ค้นหาชื่อลูกค้า เบอร์ ชื่อน้อง หรือห้อง" value="${esc(S.bkQ)}">

  bindRows(main);
  $('#fab').onclick = () => openBookingForm({ checkIn: t, checkOut: addDays(t, 1) });
}

/* ====================== Sheets ====================== */
const sheetStack = [];
function openSheet(title, html, onMount) {
  const host = $('#sheets');
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="hd"><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="ปิด">${ICON.close}</button></div><div class="bd">${html}</div></div>`;
  host.appendChild(el);
  sheetStack.push(el);
  document.body.style.overflow = 'hidden';
  el.addEventListener('click', e => { if (e.target === el) closeSheet(el); });
  $('[data-x]', el).onclick = () => closeSheet(el);
  if (onMount) onMount($('.bd', el), el);
  return el;
}
function closeSheet(el) {
  el = el || sheetStack[sheetStack.length - 1]; if (!el) return;
  el.remove(); sheetStack.splice(sheetStack.indexOf(el), 1);
  if (!sheetStack.length) document.body.style.overflow = '';
}
function closeAllSheets() { while (sheetStack.length) closeSheet(); }
function confirmBtn(btn, confirmText, fn) {
  const orig = btn.textContent; let armed = false, timer;
  btn.onclick = async () => {
    if (!armed) { armed = true; btn.textContent = confirmText; timer = setTimeout(() => { armed = false; btn.textContent = orig; }, 3500); return; }
    clearTimeout(timer);
    try { await fn(); } catch (e) { toast(e.message); armed = false; btn.textContent = orig; }
  };
}
const fv = (root, id) => { const el = $('#' + id, root); return el ? el.value.trim() : ''; };
function field(id, label, value, type = 'text', extra = '') {
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value == null ? '' : value)}" ${extra}></div>`;
}
function area(id, label, value, extra = '') { return `<div class="f"><label for="${id}">${label}</label><textarea id="${id}" ${extra}>${esc(value || '')}</textarea></div>`; }

/* ---------- Customer form ---------- */
function openCustomerForm(c, done) {
  c = c || {};
  openSheet(c.id ? 'แก้ไขลูกค้า' : 'ลูกค้าใหม่', `<form class="form" id="cf">
    ${field('c-name', 'ชื่อเจ้าของ *', c.name, 'text', 'autocomplete="off"')}
    <div class="grid2">${field('c-phone', 'เบอร์โทร', c.phone, 'tel', 'inputmode="tel"')}${field('c-line', 'LINE ID', c.line)}</div>
    ${field('c-emg', 'ผู้ติดต่อฉุกเฉิน (ชื่อ/เบอร์)', c.emergency)}
    ${area('c-addr', 'ที่อยู่', c.address)}
    ${area('c-note', 'หมายเหตุ', c.note)}
    <button class="btn pri full" type="submit">บันทึก</button></form>`, (bd, el) => {
    $('#cf', bd).onsubmit = async e => {
      e.preventDefault();
      try {
        const rec = await api('saveCustomer', { id: c.id, name: fv(bd, 'c-name'), phone: fv(bd, 'c-phone'), line: fv(bd, 'c-line'), emergency: fv(bd, 'c-emg'), address: fv(bd, 'c-addr'), note: fv(bd, 'c-note') });
        upsert(S.customers, rec); closeSheet(el); toast('บันทึกลูกค้าแล้ว'); done && done(rec);
      } catch (err) { toast(err.message); }
    };
  });
}

/* ---------- Pet form ---------- */
function compressImage(file, max = 1600) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');

    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); fr.readAsDataURL(file);
  });
}

const openStates = ['pending', 'reserved', 'in'];

        if (!lines[i].roomId) return toast(`ห้องที่ ${i + 1}: กรุณาเลือกห้อง`);
        if (!(dt.checkIn && dt.checkOut && dt.checkOut > dt.checkIn)) return toast(`ห้องที่ ${i + 1}: วันออกต้องหลังวันเข้า`);
      }

        const grp = await api('saveGroup', { groupId: fixed, customerId: d.customerId, channel, note: fv(bd, 'g-note'),

}
function openPayGroup(gid, walkin) {
  const grp = S.bookings.filter(x => (x.groupId || x.id) === gid);
  const rows = grp.filter(x => openStates.includes(effStatus(x)) && balanceOf(x) > 0);
  const due = rows.reduce((n, x) => n + balanceOf(x), 0);
  const canIn = rows.some(x => x.status !== 'in' && x.checkIn <= today());
  openSheet('รับเงินทั้งกลุ่ม', `
    <div class="list">${rows.map(x => `<div class="row" style="cursor:default"><div class="main"><div class="t">${esc((room(x.roomId) || {}).name || '')} · ${esc(petNames(x))}</div><div class="s">${thDate(x.checkIn)} – ${thDate(x.checkOut)}</div></div><div class="end num">${money2(balanceOf(x))}</div></div>`).join('')}</div>
    <div class="alert info small">ตรวจสลิปให้ตรงยอดรวมก่อนกดยืนยัน ระบบจะออกใบเสร็จใบเดียวรวมทุกห้อง</div>
    ${payPanel(due)}
    ${canIn ? `<label class="chk"><input type="checkbox" id="ci" ${walkin ? 'checked' : ''}><span>เช็กอินทันที (ห้องที่ถึงวันเข้าพักแล้ว)</span></label>` : ''}
    <button class="btn red full" id="go">ยืนยันได้รับเงินและออกใบเสร็จ</button>`, bd => {
    const method = bindPay(bd);
    $('#go', bd).onclick = async () => {
      try {
        const r = await api('payGroup', { groupId: gid, method: method(), checkIn: !!($('#ci', bd) && $('#ci', bd).checked) }, { text: 'กำลังออกใบเสร็จ…' });
        r.bookings.forEach(x => upsert(S.bookings, x)); upsert(S.receipts, r.receipt);
        closeAllSheets(); render(); toast('รับเงินและออกใบเสร็จแล้ว'); openReceipt(r.receipt.id);
      } catch (e) { toast(e.message, 5000); }
    };
  });
}
function openCheckoutGroup(gid) {
  const ins = S.bookings.filter(x => (x.groupId || x.id) === gid && x.status === 'in');
  const due = ins.reduce((n, x) => n + Math.max(0, balanceOf(x)), 0), t = today();
  const early = ins.filter(x => x.checkOut > t), late = ins.filter(x => x.checkOut < t);
  openSheet('เช็กเอาท์ทั้งกลุ่ม', `
    <div class="list">${ins.map(x => `<div class="row" style="cursor:default"><div class="main"><div class="t">${esc((room(x.roomId) || {}).name || '')} · ${esc(petNames(x))}</div><div class="s">กำหนดออก ${thDate(x.checkOut)}</div></div></div>`).join('')}</div>
    ${early.length ? `<div class="alert warn">${early.length} ห้องออกก่อนกำหนด ตามนโยบายไม่คืนเงิน ส่วนที่ไม่ได้พักบันทึกเป็นรายได้จากการริบเงินจอง</div>` : ''}
    ${late.length ? '<div class="alert bad">มีห้องเกินกำหนดออก ถ้าพักเพิ่ม ให้แก้วันออกของห้องนั้นก่อน</div>' : ''}
    ${due > 0 ? payPanel(due) : '<div class="alert ok">ชำระครบแล้ว ไม่มียอดค้าง</div>'}
    <button class="btn red full" id="go">${due > 0 ? 'รับเงินและเช็กเอาท์ทั้งหมด' : 'ยืนยันเช็กเอาท์ทั้งหมด'}</button>`, bd => {
    const method = due > 0 ? bindPay(bd) : () => '';
    $('#go', bd).onclick = async () => {
      try {
        const r = await api('checkoutGroup', { groupId: gid, method: method() }, { text: 'กำลังเช็กเอาท์…' });
        r.bookings.forEach(x => upsert(S.bookings, x)); if (r.receipt) upsert(S.receipts, r.receipt);
        closeAllSheets(); render(); toast('เช็กเอาท์ครบทุกห้องแล้ว');
        if (r.receipt) openReceipt(r.receipt.id);
      } catch (e) { toast(e.message, 5000); }
    };
  });
}

      add((Number(b.postponed) || 0) >= (Number(S.settings.postponeMax) || 1) ? 'แก้ไข (เลื่อนครบแล้ว)' : 'เลื่อนวัน / แก้ไข', 'ghost', edit);
      if (isAdmin()) {
        if (b.checkIn <= today()) add('ไม่มาเข้าพัก (ยึดเงิน)', 'danger', () => openForfeit(b, 'noshow'));
        add('ยกเลิก (ไม่คืนเงิน)', 'danger', () => openForfeit(b, 'cancelled'));
      }
    }
    if (b.status === 'in') {
      add('เช็กเอาท์' + (bal > 0 ? ` + รับเงิน ${money(bal)} ฿` : ''), 'red', () => { closeSheet(el); openCheckout(b.id); });
      add('ต่อวัน / แก้ไข', 'ghost', edit);
      if (!grouped) add(ICON.send + 'ส่งข้อความให้ลูกค้า', 'ghost', send);
      confirmBtn(add('ยกเลิกเช็กอิน', 'ghost', null), 'แตะอีกครั้งเพื่อยืนยัน', () => setStatus('reserved', 'กลับเป็นสถานะชำระแล้ว'));
    }
    if (openStates.includes(st)) add('+ เพิ่มห้องให้ลูกค้านี้', 'ghost', () => { closeSheet(el); openGroupForm({ groupId: gid, customerId: b.customerId, checkIn: b.checkIn, checkOut: b.checkOut, channel: b.channel }); });
    if ((b.status === 'cancelled' || st === 'expired') && isAdmin() && paid <= 0) {
      confirmBtn(add('ลบรายการถาวร', 'danger', null), 'แตะอีกครั้งเพื่อลบ', async () => {
        await api('deleteRecord', { type: 'booking', id: b.id }); S.bookings = S.bookings.filter(x => x.id !== b.id); closeSheet(el); render(); toast('ลบแล้ว');
      });
    }
  });
}

/* ---------- Payment / checkout ---------- */
function payPanel(total) {

}
function bindPay(bd) {

  const info = () => {

      ? (S.qrDataUrl ? `<img src="${S.qrDataUrl}" alt="QR ชำระเงิน" style="width:220px;max-width:100%;display:block;margin:0 auto">` : '<span class="muted">ยังไม่ได้อัปโหลด QR (หุ้นส่วนอัปโหลดได้ที่ เพิ่มเติม → ตั้งค่าร้าน)</span>')

function openPay(id, walkin) {
  const b = byId(S.bookings, id); if (!b) return;
  const due = balanceOf(b);
  const canIn = b.status !== 'in' && b.checkIn <= today();
  openSheet(b.status === 'pending' ? 'รับเงินและยืนยันการจอง' : 'รับเงินส่วนต่าง', `

    ${b.status === 'pending' ? '<div class="alert info small">ตรวจสลิปให้ตรงยอดก่อนกดยืนยัน ระบบจะออกใบเสร็จและล็อกห้องให้ลูกค้าทันที</div>' : ''}
    ${payPanel(due)}
    ${canIn ? `<label class="chk"><input type="checkbox" id="ci" ${walkin ? 'checked' : ''}><span>เช็กอินทันที (น้องมาถึงร้านแล้ว)</span></label>` : ''}
    <button class="btn red full" id="go">ยืนยันได้รับเงินและออกใบเสร็จ</button>`, (bd, el) => {

        upsert(S.bookings, r.booking); upsert(S.receipts, r.receipt); closeAllSheets(); render(); toast('รับเงินและออกใบเสร็จแล้ว'); openReceipt(r.receipt.id);
      } catch (e) { toast(e.message, 4500); }

}
function openCheckout(id) {
  const b = byId(S.bookings, id); if (!b) return;
  const t = today(), due = balanceOf(b);
  let note = '';
  if (b.checkOut > t) {
    const left = nightsBetween(t > b.checkIn ? t : addDays(b.checkIn, 1), b.checkOut);
    note = `<div class="alert warn">ออกก่อนกำหนด ${left} คืน (กำหนดออก ${thDate(b.checkOut)}) ตามนโยบายไม่คืนเงิน ส่วนที่ไม่ได้พักจะบันทึกเป็นรายได้จากการริบเงินจอง</div>`;
  } else if (b.checkOut < t) {
    note = `<div class="alert bad">เกินกำหนดออก (${thDate(b.checkOut)}) ถ้าพักเพิ่ม ให้กด "ต่อวัน / แก้ไข" แก้วันออกก่อน แล้วค่อยเช็กเอาท์</div>`;
  }
  openSheet('เช็กเอาท์', `${note}<div class="small muted">${esc(petNames(b))} · ${esc((room(b.roomId) || {}).name || '')}</div>
    ${due > 0 ? payPanel(due) : '<div class="alert ok">ชำระครบแล้ว ไม่มียอดค้าง</div>'}
    <button class="btn red full" id="go">${due > 0 ? 'รับเงินและเช็กเอาท์' : 'ยืนยันเช็กเอาท์'}</button>`, (bd, el) => {
    const method = due > 0 ? bindPay(bd) : () => '';
    $('#go', bd).onclick = async () => {
      try {
        const r = await api('checkout', { id: b.id, method: method() }, { text: 'กำลังเช็กเอาท์…' });
        upsert(S.bookings, r.booking); if (r.receipt) upsert(S.receipts, r.receipt);
        closeAllSheets(); render(); toast('เช็กเอาท์แล้ว น้องกลับบ้านเรียบร้อย');
        if (r.receipt) openReceipt(r.receipt.id);
      } catch (e) { toast(e.message, 4500); }
    };
  });
}

/* ---------- Confirmation message for LINE / Messenger ---------- */
function confirmText(b, group) {
  const s = S.settings, c = cust(b.customerId) || {};
  const list = (group ? groupOf(b) : [b]).filter(x => openStates.includes(effStatus(x)) || x.status === 'out');
  const pending = list.filter(x => effStatus(x) === 'pending');
  const total = list.reduce((n, x) => n + Number(x.total), 0);
  const name = c.name || '';
  const lines = [`ยืนยันการจองห้องพัก ${s.brandName || 'Uhaus'}`, '', (/^(คุณ|คุน|K\.|Khun)/i.test(name) ? name : 'คุณ' + name), ''];
  list.forEach((x, i) => {
    const r = room(x.roomId) || {};
    if (list.length > 1) lines.push(`ห้องที่ ${i + 1}: ${r.name || ''}`); else lines.push(`ห้อง: ${r.name || ''}`);
    lines.push(`น้อง: ${petNames(x)}`, `เข้าพัก ${thDateLong(x.checkIn)} – เช็กเอาท์ ${thDateLong(x.checkOut)} (${x.nights} คืน)`);
    if (Number(x.discount)) lines.push(`ส่วนลดพัก ${s.promoNights} คืนขึ้นไป ${money(x.discount)} บาท`);
    lines.push(`ค่าห้อง ${money2(x.total)} บาท`, '');
  });
  if (list.length > 1) lines.push(`ยอดรวม ${list.length} ห้อง: ${money2(total)} บาท`, '');
  if (pending.length) {
    const until = Math.min(...pending.map(x => Number(x.holdUntil)));
    const paidSoFar = list.reduce((n, x) => n + paidOf(x), 0);
    const due = list.reduce((n, x) => n + Math.max(0, balanceOf(x)), 0);
    if (paidSoFar > 0) lines.push(`ชำระแล้ว ${money2(paidSoFar)} บาท ยอดที่ต้องโอนเพิ่ม ${money2(due)} บาท`);
    lines.push(`กรุณาโอนเต็มจำนวนภายในเวลา ${hhmm(until)} น. (${Number(s.holdMinutes) || 30} นาที) เพื่อยืนยันการจอง หากเกินเวลา ระบบจะยกเลิกการจองอัตโนมัติ`,
      '', `${s.bankName}`, `เลขที่บัญชี ${s.bankAccount}`, `ชื่อบัญชี ${s.bankAccountName}`, '', 'โอนแล้วส่งสลิปในแชตนี้ได้เลยค่ะ');
  } else {
    const nos = [...new Set(list.flatMap(x => receiptsOf(x).filter(r => r.status === 'issued').map(r => r.no)))];
    const bal = list.reduce((n, x) => n + Math.max(0, balanceOf(x)), 0);
    lines.push(`ได้รับชำระแล้ว ${money2(list.reduce((n, x) => n + paidOf(x), 0))} บาท${nos.length ? ' (ใบเสร็จเลขที่ ' + nos.join(', ') + ')' : ''}`);
    if (bal > 0) lines.push(`ยอดค้างชำระ ${money2(bal)} บาท`);
    lines.push('การจองได้รับการยืนยันแล้วค่ะ');
  }
  lines.push('', 'เงื่อนไขการจอง', '• ชำระแล้วไม่คืนเงินทุกกรณี',
    `• เลื่อนวันได้ ${s.postponeMax || 1} ครั้ง แจ้งล่วงหน้าอย่างน้อย ${s.noticeDays} วัน (ปีใหม่ สงกรานต์ และวันหยุดยาว ${s.peakNoticeDays} วัน) และเข้าพักภายใน ${s.postponeWindowDays} วันจากวันเดิม`,
    '• กรุณานำสมุดวัคซีนของน้องมาในวันเข้าพัก', '', `ขอบคุณที่ไว้วางใจ ${s.brandName || 'Uhaus'} ค่ะ`);
  return lines.join('\n');
}

/* ====================== Receipt ====================== */
function bahtText(num) {
  num = Math.round((Number(num) || 0) * 100) / 100;
  const D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const rd = s => { s = String(Number(s)); if (s === '0') return ''; let out = '';
    if (s.length > 6) { out = rd(s.slice(0, -6)) + 'ล้าน'; s = s.slice(-6); }
    const n = s.length;
    for (let i = 0; i < n; i++) { const dg = +s[i], pos = n - i - 1; if (!dg) continue;
      if (pos === 0 && dg === 1 && n > 1) out += 'เอ็ด'; else if (pos === 1 && dg === 2) out += 'ยี่'; else if (pos === 1 && dg === 1) out += ''; else out += D[dg];
      out += P[pos]; }
    return out; };
  const [i, f] = num.toFixed(2).split('.');
  const bt = i === '0' ? 'ศูนย์' : rd(i);
  return bt + 'บาท' + (+f ? rd(f) + 'สตางค์' : 'ถ้วน');
}
function receiptHTML(rc) {

    <div class="meta"><div>ได้รับเงินจาก <b>${esc(rc.customerName)}</b>${rc.customerPhone ? ' โทร ' + esc(rc.customerPhone) : ''}</div><div>เลขที่ <b>${esc(rc.no)}</b></div>

async function receiptFile(rc, kind) {
  if (!window.html2canvas) throw new Error('โหลดเครื่องมือสร้างไฟล์ไม่สำเร็จ ลองเปิดแอปใหม่');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0';
  host.innerHTML = receiptHTML(rc);
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all($$('img', host).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const canvas = await html2canvas(host.firstElementChild, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
    if (kind === 'png') {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      return new File([blob], rc.no + '.png', { type: 'image/png' });
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a5', orientation: 'portrait' });
    const pw = 148, ph = 210, m = 6;
    let w = pw - m * 2, h = canvas.height * w / canvas.width;
    if (h > ph - m * 2) { h = ph - m * 2; w = canvas.width * h / canvas.height; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w) / 2, m, w, h);
    return new File([pdf.output('blob')], rc.no + '.pdf', { type: 'application/pdf' });
  } finally { host.remove(); }
}
async function shareReceipt(rc, kind) {
  busy(true, 'กำลังสร้างไฟล์…');
  let file;
  try { file = await receiptFile(rc, kind); } catch (e) { busy(false); return toast(e.message); }
  busy(false);
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'ใบเสร็จ ' + rc.no }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = file.name; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function openReceipt(id) {
  const rc = byId(S.receipts, id); if (!rc) return toast('ไม่พบใบเสร็จ');
  openSheet('ใบเสร็จ ' + rc.no, `<div class="paperwrap">${receiptHTML(rc)}</div>
    <div class="btns"><button class="btn red" id="pdf">แชร์ PDF</button><button class="btn pri" id="png">แชร์เป็นรูปภาพ (LINE)</button></div>
    ${isAdmin() && rc.status === 'issued' ? `<div class="form" style="gap:8px">${field('vr', 'เหตุผลการยกเลิกใบเสร็จ', '')}<button class="btn danger" id="void">ยกเลิกใบเสร็จนี้</button></div>` : ''}`, (bd, el) => {
    const fit = () => { const w = $('.paperwrap', bd), pp = $('#paper', bd); if (w && pp) pp.style.zoom = Math.min(1, (w.clientWidth - 2) / 560); };
    fit(); addEventListener('resize', fit);
    $('#pdf', bd).onclick = () => shareReceipt(rc, 'pdf');
    $('#png', bd).onclick = () => shareReceipt(rc, 'png');
    if ($('#void', bd)) confirmBtn($('#void', bd), 'แตะอีกครั้งเพื่อยกเลิกใบเสร็จ', async () => {
      const nr = await api('voidReceipt', { id: rc.id, reason: fv(bd, 'vr') });

    });
  });
}

/* ---------- Reports ---------- */
function rptRange() {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  if (S.rpt === 'today') return [t, t];
  if (S.rpt === 'month') return [t.slice(0, 8) + '01', t];
  if (S.rpt === 'last') { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; const last = new Date(Date.UTC(py, pm, 0)).getUTCDate(); return [`${py}-${pad(pm)}-01`, `${py}-${pad(pm)}-${pad(last)}`]; }
  return [S.rptFrom || t.slice(0, 8) + '01', S.rptTo || t];
}
// รายได้ค่าห้องรับรู้ตามคืนที่พักจริง ถึงสิ้นวัน D
function recognizedThrough(b, D) {
  if (b.status !== 'in' && b.status !== 'out') return 0;
  const end = b.status === 'out' ? (b.actualCheckOut || b.checkOut) : b.checkOut;
  const stop = addDays(D, 1) < end ? addDays(D, 1) : end;
  const n = Math.max(0, Math.min(nightsBetween(b.checkIn, stop), Number(b.nights)));
  return Number(b.total) * n / Number(b.nights);
}
function paidThrough(b, D) { return receiptsOf(b).filter(r => r.status === 'issued' && r.date <= D).reduce((n, r) => n + allocAmt(r, b), 0); }
function forfeitThrough(b, D, from) { return forfeitsOf(b).filter(f => f.date <= D && (!from || f.date >= from)).reduce((n, f) => n + Number(f.amount), 0); }
function vReports(main) {
  const [from, to] = rptRange(), before = addDays(from, -1);
  const rcs = S.receipts.filter(r => r.status === 'issued' && r.date >= from && r.date <= to).sort((a, b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const cash = rcs.reduce((n, r) => n + Number(r.total), 0);
  const byM = m => rcs.filter(r => r.method === m).reduce((n, r) => n + Number(r.total), 0);
  const cashRoom = rcs.filter(r => r.refType !== 'grooming').reduce((n, r) => n + Number(r.total), 0);
  const groom = rcs.filter(r => r.refType === 'grooming').reduce((n, r) => n + Number(r.total), 0);
  let roomRev = 0, forfRev = 0, unearned = 0, accrued = 0;
  S.bookings.forEach(b => {
    roomRev += recognizedThrough(b, to) - recognizedThrough(b, before);
    forfRev += forfeitThrough(b, to, from);
    const bal = paidThrough(b, to) - recognizedThrough(b, to) - forfeitThrough(b, to);
    if (bal > 0.004) unearned += bal; else if (bal < -0.004) accrued += -bal;
  });
  const phys = activeRooms().filter(r => !r.combines);
  const days = nightsBetween(from, addDays(to, 1));
  let sold = 0;
  S.bookings.filter(b => b.status === 'in' || b.status === 'out' || b.status === 'reserved').forEach(b => {
    const r = room(b.roomId); if (!r) return;
    const endB = b.status === 'out' ? (b.actualCheckOut || b.checkOut) : b.checkOut;
    const a = b.checkIn > from ? b.checkIn : from, e = endB < addDays(to, 1) ? endB : addDays(to, 1);
    const n = nightsBetween(a, e); if (n > 0) sold += n * physical(r).length;
  });
  const occ = phys.length && days > 0 ? Math.round(sold / (phys.length * days) * 1000) / 10 : 0;
  const made = S.bookings.filter(b => b.createdAt && b.createdAt.slice(0, 10) >= from && b.createdAt.slice(0, 10) <= to && !['expired'].includes(effStatus(b)) && !(b.status === 'cancelled' && !paidOf(b)));
  const daily = {};
  rcs.forEach(r => { daily[r.date] = (daily[r.date] || 0) + Number(r.total); });
  const k = (l, v, extra) => `<div class="kpi"><div class="l">${l}</div><div class="v num sm">${money2(v)}</div>${extra || ''}</div>`;
  main.innerHTML = `
    <div class="seg" id="rp">${[['today', 'วันนี้'], ['month', 'เดือนนี้'], ['last', 'เดือนก่อน'], ['custom', 'กำหนดเอง']].map(x => `<button data-v="${x[0]}" class="${S.rpt === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    ${S.rpt === 'custom' ? `<div class="grid2">${field('rf', 'ตั้งแต่', from, 'date')}${field('rt', 'ถึง', to, 'date')}</div>` : `<div class="muted small">${thDateLong(from)} – ${thDateLong(to)}</div>`}
    <div class="sec"><h2>เงินรับ (ตามวันที่ออกใบเสร็จ)</h2></div>
    <div class="kpis">
      <div class="kpi hero" style="grid-column:1/-1"><div class="l">เงินรับทั้งหมด · ${rcs.length} ใบเสร็จ</div><div class="v num">${money2(cash)} <small>บาท</small></div></div>
      ${k('รับค่าห้องพัก', cashRoom)}${k('รับค่าอาบน้ำตัดขน', groom)}${k('รับโอน', byM('transfer'))}${k('รับผ่าน QR', byM('qr'))}
    </div>
    <div class="sec"><h2>รายได้ (ตามคืนที่ให้บริการ)</h2></div>
    <div class="kpis">
      ${k('รายได้ค่าห้องพัก', roomRev)}${k('รายได้ริบเงินจอง', forfRev, '<div class="small muted">ยกเลิก · ไม่มา · ออกก่อน</div>')}
      ${k('รายได้อาบน้ำตัดขน', groom)}${k('รวมรายได้', roomRev + forfRev + groom)}
    </div>
    <div class="sec"><h2>ยอดคงเหลือ ณ ${thDateLong(to)}</h2></div>
    <div class="kpis">
      ${k('รายได้รับล่วงหน้า', unearned, '<div class="small muted">ลูกค้าจ่ายแล้ว ยังไม่ได้เข้าพัก</div>')}
      ${k('ค่าห้องค้างรับ', accrued, '<div class="small muted">พักแล้ว ยังไม่ได้ชำระส่วนต่าง</div>')}
      <div class="kpi"><div class="l">อัตราเข้าพัก</div><div class="v num sm">${occ}%</div><div class="small muted">${sold} / ${phys.length * days} ห้อง-คืน</div></div>
    </div>
    <div class="sec"><h2>การจองตามช่องทาง</h2></div>
    <div class="list">${Object.keys(CHANNELS).map(c => { const xs = made.filter(b => (b.channel || 'line') === c); return `<div class="row" style="cursor:default"><div class="main"><div class="t">${CHANNELS[c]}</div><div class="s">${xs.length} การจอง</div></div><div class="end num">${money2(xs.reduce((n, b) => n + Number(b.total), 0))}</div></div>`; }).join('')}</div>
    <div class="sec"><h2>เงินรับรายวัน</h2></div>
    <div class="list">${Object.keys(daily).length ? Object.keys(daily).sort().reverse().map(d => `<div class="row" style="cursor:default"><div class="main">${thDateLong(d)}</div><div class="end num">${money2(daily[d])}</div></div>`).join('') : emptyBox('ไม่มีเงินรับในช่วงนี้')}</div>
    <button class="btn pri full" id="csv">ส่งออกใบเสร็จช่วงนี้เป็นไฟล์ Excel (CSV)</button>
    <div class="muted small">รายได้ค่าห้องเฉลี่ยตามคืนที่พักจริงจากยอดหลังส่วนลด รายได้รับล่วงหน้า = เงินรับ − รายได้ที่รับรู้ − เงินริบ ของแต่ละการจอง</div>`;
  $$('#rp button').forEach(b => b.onclick = () => { S.rpt = b.dataset.v; render(); });
  if ($('#rf')) { $('#rf').onchange = e => { S.rptFrom = e.target.value; render(); }; $('#rt').onchange = e => { S.rptTo = e.target.value; render(); }; }
  $('#csv').onclick = async () => {
    const head = ['วันที่', 'เลขที่ใบเสร็จ', 'ลูกค้า', 'ประเภท', 'ค่าห้อง', 'ค่าตัวเพิ่ม', 'ส่วนลด', 'ปรับยอด', 'อาบน้ำตัดขน', 'ยอดสุทธิ', 'ช่องทาง', 'ผู้รับเงิน'];
    const rows = rcs.map(r => [r.date, r.no, r.customerName, r.refType !== 'grooming' ? 'ห้องพัก' : 'อาบน้ำตัดขน', r.roomAmount, r.extraAmount, r.discount, r.adjust, r.groomAmount, r.total, r.method === 'qr' ? 'QR' : 'โอน', r.receivedBy]);
    const csv = '﻿' + [head, ...rows].map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const file = new File([csv], `Uhaus-ใบเสร็จ-${from}-${to}.csv`, { type: 'text/csv' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  };
}

    <div class="sec"><h2>นโยบายการจอง</h2></div>
    <div class="card form">
      <div class="grid2">${field('s-hold', 'ล็อกห้องรอโอน (นาที)', s.holdMinutes, 'number', 'inputmode="numeric" min="5"')}${field('s-pmax', 'เลื่อนวันได้ (ครั้ง)', s.postponeMax, 'number', 'inputmode="numeric" min="0"')}</div>
      <div class="grid2">${field('s-nd', 'แจ้งเลื่อนล่วงหน้า วันปกติ (วัน)', s.noticeDays, 'number', 'inputmode="numeric" min="0"')}${field('s-pnd', 'แจ้งเลื่อนล่วงหน้า ช่วงเทศกาล (วัน)', s.peakNoticeDays, 'number', 'inputmode="numeric" min="0"')}</div>
      ${field('s-win', 'ต้องเข้าพักภายในกี่วันจากวันเดิม', s.postponeWindowDays, 'number', 'inputmode="numeric" min="1"')}
      <div class="muted small">ชำระแล้วไม่คืนเงินทุกกรณี: ยกเลิก ไม่มา และออกก่อนกำหนด บันทึกเป็นรายได้จากการริบเงินจอง</div>
    </div>
    <div class="sec"><h2>ช่วงเทศกาล / วันหยุดยาว</h2><button type="button" class="lnk" id="pk-add">+ เพิ่มช่วง</button></div>
    <div class="card form" id="pk"></div>
    <button class="btn pri full">บันทึกการตั้งค่า</button></form>
    <div class="sec"><h2>QR รับชำระเงิน</h2></div>
    <div class="card form">${S.qrDataUrl ? `<img src="${S.qrDataUrl}" alt="QR" style="width:200px;max-width:100%">` : '<div class="muted small">ยังไม่ได้อัปโหลด QR</div>'}
      <div class="f"><label for="s-qr">เลือกรูป QR จากอัลบั้ม</label><input id="s-qr" type="file" accept="image/*"></div></div>`;
  const drawPeaks = () => {
    const box = $('#pk', main);
    box.innerHTML = peaks.length ? peaks.map((p, i) => `<div class="peak" data-i="${i}">
      ${field('pk-n' + i, 'ชื่อช่วง', p.name)}${field('pk-f' + i, 'ตั้งแต่', p.from, 'date')}${field('pk-t' + i, 'ถึง', p.to, 'date')}
      <button type="button" class="iconbtn" data-del="${i}" aria-label="ลบช่วงนี้">${ICON.close}</button></div>`).join('')
      : '<div class="muted small">ยังไม่มีช่วงเทศกาล เพิ่มช่วงปีใหม่ สงกรานต์ และวันหยุดยาวแต่ละครั้ง การจองที่วันเข้าพักเดิมตกในช่วงนี้ต้องแจ้งเลื่อนล่วงหน้า ' + esc(s.peakNoticeDays) + ' วัน</div>';
    $$('[data-i]', box).forEach(row => {
      const i = +row.dataset.i;
      $$('input', row).forEach(inp => inp.oninput = () => { peaks[i] = { name: fv(row, 'pk-n' + i), from: fv(row, 'pk-f' + i), to: fv(row, 'pk-t' + i) }; });
    });
    $$('[data-del]', box).forEach(b => b.onclick = () => { peaks.splice(+b.dataset.del, 1); drawPeaks(); });
  };
  drawPeaks();
  $('#pk-add', main).onclick = () => { const y = today().slice(0, 4); peaks.push({ name: '', from: '', to: '' }); drawPeaks(); };
  $('#sf').onsubmit = async e => {
    e.preventDefault();
    try {
      S.settings = await api('saveSettings', { companyName: fv(main, 's-co'), branch: fv(main, 's-br'), brandName: fv(main, 's-bn'), address: fv(main, 's-ad'), taxId: fv(main, 's-tx'),
        bankName: fv(main, 's-bk'), bankAccount: fv(main, 's-ac'), bankAccountName: fv(main, 's-an'), promoNights: fv(main, 's-pn'), promoPct: fv(main, 's-pp'),
        holdMinutes: fv(main, 's-hold'), postponeMax: fv(main, 's-pmax'), noticeDays: fv(main, 's-nd'), peakNoticeDays: fv(main, 's-pnd'), postponeWindowDays: fv(main, 's-win'),
        peakPeriods: JSON.stringify(peaks.filter(p => p.name || p.from || p.to)) });
      toast('บันทึกการตั้งค่าแล้ว'); render();
    } catch (err) { toast(err.message, 4000); }
  };
  $('#s-qr').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = await compressImage(f, 1000); S.qrDataUrl = await api('uploadQR', { dataUrl: d }, { text: 'กำลังอัปโหลด QR…' }); render(); toast('อัปโหลด QR แล้ว'); } catch (err) { toast(err.message); }
  };
}
function vRoomsAdmin(main) {
  if (!isAdmin()) return go('more');
  main.innerHTML = ZONES.map(z => `<div class="sec"><h2>${esc(ZONE_TH[z])}</h2></div><div class="list">${S.rooms.filter(r => r.zone === z).map(r => `<div class="row" data-rm="${r.id}"><div class="main"><div class="t">${esc(r.name)}</div>
    <div class="s">รวม ${r.included} ตัว${r.maxPets !== '' ? ' · สูงสุด ' + r.maxPets : ''} · ตัวเพิ่ม +${money(r.extraFee)}${r.combines ? ' · ใช้ห้อง ' + esc(r.combines) : ''}</div></div>
    <div class="end">${truthy(r.active) ? '' : '<span class="pill p-out">ปิด</span>'}<div class="num">${money(r.price)} ฿</div>${r.normalPrice !== '' ? `<div class="small muted num" style="text-decoration:line-through">${money(r.normalPrice)}</div>` : ''}</div></div>`).join('')}</div>`).join('');
  $$('[data-rm]', main).forEach(el => el.onclick = () => {
    const r = room(el.dataset.rm);
    openSheet('แก้ไข ' + r.name, `<form class="form" id="rf">${field('r-name', 'ชื่อห้อง', r.name)}
      <div class="grid2">${field('r-np', 'ราคาปกติ', r.normalPrice, 'number', 'inputmode="decimal"')}${field('r-p', 'ราคาขาย (โปร) ต่อคืน', r.price, 'number', 'inputmode="decimal"')}</div>
      <div class="grid2">${field('r-inc', 'ราคารวมกี่ตัว', r.included, 'number', 'inputmode="numeric" min="1"')}${field('r-max', 'สูงสุดกี่ตัว (ว่าง = ไม่จำกัด)', r.maxPets, 'number', 'inputmode="numeric" min="1"')}</div>
      ${field('r-ex', 'ค่าตัวเพิ่ม/ตัว/คืน', r.extraFee, 'number', 'inputmode="decimal"')}
      <label class="chk"><input type="checkbox" id="r-act" ${truthy(r.active) ? 'checked' : ''}><span>เปิดให้บริการ</span></label>
      <div class="muted small">ราคาใหม่มีผลกับการจองที่สร้างหรือแก้ไขหลังจากนี้ การจองเดิมคงราคาเดิม</div>
      <button class="btn pri full">บันทึก</button></form>`, (bd, sh) => {
      $('#rf', bd).onsubmit = async e => {
        e.preventDefault();
        try { const rec = await api('saveRoom', { id: r.id, name: fv(bd, 'r-name'), normalPrice: fv(bd, 'r-np'), price: fv(bd, 'r-p'), included: fv(bd, 'r-inc'), maxPets: fv(bd, 'r-max'), extraFee: fv(bd, 'r-ex'), active: $('#r-act', bd).checked });
          upsert(S.rooms, rec); closeSheet(sh); render(); toast('บันทึกห้องแล้ว'); } catch (err) { toast(err.message); }
      };
    });
  });
}
async function vUsers(main) {
  if (!isAdmin()) return go('more');
  main.innerHTML = '<div class="empty">กำลังโหลด…</div>';
  let users;
  try { users = await api('listUsers', {}, { silent: true }); } catch (e) { main.innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; return; }
  const draw = () => {
    main.innerHTML = `<div class="alert info">หุ้นส่วน: ทำได้ทุกอย่าง · พนักงาน: จอง เช็กอิน เช็กเอาท์ ออกใบเสร็จ แต่แก้ราคาและลบข้อมูลไม่ได้</div>
      <div class="list">${users.map(u => `<div class="row" data-u="${u.id}"><div class="main"><div class="t">${esc(u.name)}</div><div class="s">${u.role === 'admin' ? 'หุ้นส่วน' : 'พนักงาน'}</div></div><div class="end">${u.active ? '<span class="pill p-ok">ใช้งาน</span>' : '<span class="pill p-out">ปิด</span>'}</div></div>`).join('')}</div>
      <button class="fab" id="fab">${ICON.plus}เพิ่มผู้ใช้</button>`;
    $$('[data-u]', main).forEach(el => el.onclick = () => form(users.find(u => u.id === el.dataset.u)));
    $('#fab').onclick = () => form({ role: 'staff', active: true });
  };
  const form = u => openSheet(u.id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้', `<form class="form" id="uf">${field('u-n', 'ชื่อ', u.name)}
    <div class="f"><label for="u-r">สิทธิ์</label><select id="u-r"><option value="staff" ${u.role !== 'admin' ? 'selected' : ''}>พนักงาน</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>หุ้นส่วน</option></select></div>
    ${field('u-p', u.id ? 'ตั้ง PIN ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'PIN (ตัวเลข 4–8 หลัก)', '', 'password', 'inputmode="numeric" autocomplete="off"')}
    ${u.id ? `<label class="chk"><input type="checkbox" id="u-a" ${u.active ? 'checked' : ''}><span>เปิดใช้งาน</span></label>` : ''}
    <button class="btn pri full">บันทึก</button></form>`, (bd, el) => {
    $('#uf', bd).onsubmit = async e => {
      e.preventDefault();
      try { users = await api('saveUser', { id: u.id, name: fv(bd, 'u-n'), role: fv(bd, 'u-r'), pin: fv(bd, 'u-p'), active: u.id ? $('#u-a', bd).checked : true }); closeSheet(el); draw(); toast('บันทึกผู้ใช้แล้ว'); } catch (err) { toast(err.message); }
    };
  });
  draw();
}

/* ====================== Boot ====================== */
(async function boot() {
  const pawSvg = c => 'url("data:image/svg+xml,' + encodeURIComponent(ICON.paw.replace('currentColor', c).replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"')) + '")';
  const pat = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140"><g fill="#A65B49" opacity=".07">' +
    '<g transform="translate(18 20) rotate(-18 12 12) scale(1.1)">' + ICON.paw.replace(/<\/?svg[^>]*>/g, '').replace('fill="currentColor"', '') + '</g>' +
    '<g transform="translate(86 84) rotate(22 12 12) scale(.9)">' + ICON.paw.replace(/<\/?svg[^>]*>/g, '') + '</g></g></svg>') + '")';
  document.documentElement.style.setProperty('--paw-ivory', pawSvg('#F7F3EB'));
  document.documentElement.style.setProperty('--paw-pattern', pat);
  setInterval(() => {
    let expired = false;
    $$('[data-hold]').forEach(el => {
      const left = Math.ceil((Number(el.dataset.hold) - Date.now()) / 60000);
      if (left <= 0) expired = true;
      const txt = 'เหลือ ' + Math.max(0, left) + ' นาที';
      const last = el.lastChild; if (last && last.nodeType === 3) last.textContent = el.tagName === 'SPAN' && el.classList.contains('pill') ? 'เหลือ ' + Math.max(0, left) + ' นาที' : txt;
    });
    if (expired && S.user && S.user.name && !sheetStack.length) render();
  }, 20000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!API) return render();
  if (TOKEN) {
    S.user = { name: '', role: 'staff' };
    $('#app').innerHTML = '<div class="login"><img src="logo.png" alt="Uhaus"><div class="muted">กำลังโหลดข้อมูล…</div></div>';
    try { await loadAll(true); } catch (e) { if (S.user && !S.user.name) { S.user = null; } render(); toast(e.message, 4000); }
  } else render();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.user.name && !sheetStack.length) loadAll(true).catch(() => {}); });
})();
</script>
