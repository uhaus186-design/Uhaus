<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Uhaus</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uhaus">
<meta name="theme-color" content="#1E2F45">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one-column phone app, sticky header + bottom tab bar; sheets slide up for forms */
:root{
  --navy:#1E2F45; --red:#C8202A; --tan:#C9B49A; --mist:#DCE6F0;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EEF2F7; --ink:#18212E; --muted:#5D6B7E; --line:#D9E0EA;
  --accent:var(--navy); --accent-ink:#FFFFFF;
  --ok:#1D7A55; --ok-bg:#E2F3EA; --warn:#9A6400; --warn-bg:#FBF0D9; --bad:#B4232B; --bad-bg:#FBE4E5;
  --resv:#C9D9EE; --resv-ink:#1E2F45; --inhouse:#1E2F45; --inhouse-ink:#FFFFFF; --out:#E4E7EC;
  --display:'Mitr','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --r:14px; --tab:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1621; --surface:#18222F; --surface2:#202C3B; --ink:#E7ECF3; --muted:#9AA8BA; --line:#2B3949;
  --accent:#9CB9E3; --accent-ink:#0F1621; --mist:#22324A;
  --ok:#6BCB9C; --ok-bg:#16322A; --warn:#E8B656; --warn-bg:#3A2E14; --bad:#F07A7F; --bad-bg:#3D1C20;
  --resv:#2C4566; --resv-ink:#DCE6F0; --inhouse:#9CB9E3; --inhouse-ink:#0F1621; --out:#263241;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--surface2);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);font-weight:600}

/* Common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h2{font-size:17px}
.sec .lnk{color:var(--accent);font-size:14px;background:none;border:0;cursor:pointer;padding:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-resv{background:var(--resv);color:var(--resv-ink)}
.p-in{background:var(--inhouse);color:var(--inhouse-ink)}
.p-out{background:var(--out);color:var(--muted)}
.p-cxl{background:var(--bad-bg);color:var(--bad)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:26px;line-height:1.2}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--body)}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .l{color:#C6D4E6}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.alert{border-radius:12px;padding:10px 12px;font-size:14px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--mist);color:var(--ink)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 18px);z-index:25;
  border:0;background:var(--red);color:#fff;border-radius:999px;height:54px;padding:0 20px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(200,32,42,.35);cursor:pointer}
.fab svg{width:22px;height:22px}

/* Forms */
.form{display:flex;flex-direction:column;gap:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
.f textarea{min-height:76px;resize:vertical}
.f input[type=date]{-webkit-appearance:none;appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.chk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--navy);flex:none;margin:0}
.f label.chk{display:flex;margin:0;color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.price{background:var(--mist);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.price .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.price .tot{font-family:var(--display);font-size:22px;border-top:1px dashed var(--muted);padding-top:6px;margin-top:4px}
.picker{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:240px;overflow-y:auto;background:var(--surface)}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;background:var(--surface)}
.picked .main{flex:1;min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:18px;flex:1;min-width:0}
.sheet .bd{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}

/* Grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
table.occ{border-collapse:separate;border-spacing:0;font-size:12px}
table.occ th,table.occ td{height:36px;min-width:40px;width:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
table.occ thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:500;color:var(--muted);line-height:1.15;height:42px}
table.occ thead th.wk{color:var(--red)}
table.occ thead th.td{background:var(--mist);color:var(--ink)}
table.occ th.rn{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 8px;min-width:104px;width:104px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
table.occ thead th.rn{z-index:4}
table.occ tr.zone th{position:sticky;left:0;background:var(--surface2);text-align:left;padding:4px 8px;font-family:var(--display);font-weight:500;color:var(--ink);height:30px}
table.occ td{cursor:pointer}
table.occ td.b-resv{background:var(--resv);color:var(--resv-ink)}
table.occ td.b-in{background:var(--inhouse);color:var(--inhouse-ink)}
table.occ td.b-out{background:var(--out);color:var(--muted)}
table.occ td.blk{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,var(--line) 4px,var(--line) 6px)}
table.occ td .lb{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:visible;text-align:left;padding-left:4px;position:relative;z-index:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--surface)}
.login img{width:220px;max-width:70%;background:#fff;border-radius:16px;padding:8px}
.pin{display:flex;gap:10px}
.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
@media(prefers-color-scheme:dark){.pin span{border-color:var(--accent)}}
.pin span.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border-radius:50%;border:0;background:var(--surface2);font-family:var(--display);font-size:24px;cursor:pointer}
.pad button.sm{font-family:var(--body);font-size:14px;background:none}

/* Receipt (always white paper) */
.paper{background:#fff;color:#111;width:560px;padding:28px 30px;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;line-height:1.5}
.paperwrap{overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff}
.paper .hdr{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid #1E2F45;padding-bottom:12px}
.paper .hdr img{width:150px}
.paper .co{text-align:right;font-size:12px}
.paper .co b{font-size:14px;display:block}
.paper .ttl{text-align:center;margin:14px 0 8px;font-family:'Mitr',sans-serif;font-size:20px;color:#1E2F45}
.paper .ttl small{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:12px;color:#555}
.paper .meta{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin-bottom:10px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0}
.paper th{background:#DCE6F0;font-weight:600;padding:6px 8px;text-align:left;font-size:12px}
.paper td{padding:6px 8px;border-bottom:1px solid #E3E7ED;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.paper .sum{margin-left:auto;width:260px}
.paper .sum div{display:flex;justify-content:space-between;padding:2px 0}
.paper .sum .g{font-weight:600;font-size:15px;border-top:1px solid #1E2F45;margin-top:4px;padding-top:6px}
.paper .words{background:#F3F5F8;padding:6px 10px;border-radius:6px;margin:8px 0;text-align:center}
.paper .pay{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:12px}
.paper .sig{text-align:center;margin-top:26px;font-size:12px}
.paper .sig .ln{border-top:1px dotted #555;width:180px;margin:0 auto 4px;padding-top:4px}
.paper .void{color:#B4232B;border:2px solid #B4232B;display:inline-block;padding:2px 10px;font-weight:600;transform:rotate(-6deg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 84px);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.busy{position:fixed;inset:0;z-index:80;background:rgba(10,16,24,.18);display:grid;place-items:center}
.busy div{background:var(--surface);padding:14px 18px;border-radius:14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.thumb{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.vx{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>
<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div>กำลังบันทึก…</div></div>

<script>
'use strict';
/* ====================== Utilities ====================== */
const API = (window.UHAUS_API || '').trim();
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n) || 0).toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const money2 = n => (Number(n) || 0).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pad = (n, w = 2) => String(n).padStart(w, '0');
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา','จ','อ','พ','พฤ','ศ','ส'];
function localISO(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { return new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10))); }
function addDays(s, n) { const d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function nightsBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function thDate(s, withYear = true) { if (!s) return '–'; const d = parseISO(s); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()] + (withYear ? ' ' + String(d.getUTCFullYear() + 543).slice(2) : ''); }
function thDateLong(s) { if (!s) return '–'; const d = parseISO(s); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543); }
function dow(s) { return parseISO(s).getUTCDay(); }
const today = () => localISO();
const truthy = v => v === true || v === 'TRUE' || v === 'true' || v === 1;
const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>',
  rooms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3M8 13h2M14 13h2M8 16.5h2"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4h10a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 12.5h4"/></svg>',
  cust:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c.7-3.2 3.2-5 6-5s5.3 1.8 6 5"/><circle cx="17.5" cy="10" r="2.3"/><path d="M16 15.2c2.4-.3 4.3 1.1 5 3.8"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg>'
};
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
function busy(on, text) { const b = $('#busy'); if (text) b.firstElementChild.textContent = text; else b.firstElementChild.textContent = 'กำลังบันทึก…'; b.hidden = !on; }

/* ====================== API ====================== */
let TOKEN = store('uh_token') || '';
async function api(action, payload, opts = {}) {
  if (!opts.silent) busy(true, opts.text);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: TOKEN, payload, pin: payload && payload.pin }) });
    const j = await res.json();
    if (!j.ok) {
      if (j.code === 'auth') { TOKEN = ''; store('uh_token', null); S.user = null; closeAllSheets(); render(); }
      throw new Error(j.error || 'เกิดข้อผิดพลาด');
    }
    return j.data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง');
    throw e;
  } finally { if (!opts.silent) busy(false); }
}

const S = { user: null, settings: {}, rooms: [], customers: [], pets: [], bookings: [], grooming: [], receipts: [], users: [],
  view: 'today', param: null, gridStart: today(), gridZone: 'all', bkFilter: 'upcoming', custQ: '', bkQ: '', grFilter: 'open',
  rpt: 'month', rptFrom: '', rptTo: '', qrDataUrl: '', sheetUrl: '' };
const isAdmin = () => S.user && S.user.role === 'admin';
const byId = (arr, id) => arr.find(x => x.id === id);
const room = id => byId(S.rooms, id);
const cust = id => byId(S.customers, id);
const pet = id => byId(S.pets, id);
const petIdsOf = b => String(b.petIds || '').split(',').filter(Boolean);
const petNames = b => petIdsOf(b).map(id => (pet(id) || {}).name).filter(Boolean).join(', ');
function upsert(arr, rec) { const i = arr.findIndex(x => x.id === rec.id); if (i >= 0) arr[i] = rec; else arr.push(rec); return rec; }

async function loadAll(silent) {
  const d = await api('bootstrap', {}, { silent, text: 'กำลังโหลดข้อมูล…' });
  Object.assign(S, { user: d.user, settings: d.settings, rooms: d.rooms, customers: d.customers, pets: d.pets, bookings: d.bookings,
    grooming: d.grooming, receipts: d.receipts, users: d.users || [], qrDataUrl: d.qrDataUrl || '', sheetUrl: d.sheetUrl || '' });

}

/* ====================== Domain logic ====================== */
const ZONES = ['Cat Hotel', 'Dog Home', 'Dog Condo'];
const ZONE_TH = { 'Cat Hotel': 'Cat Hotel · ห้องแมว', 'Dog Home': 'Dog Home · หมาชั้นเดียว', 'Dog Condo': 'Dog Condo · หมา 3 ชั้น' };
const STATUS = { reserved: ['จองแล้ว', 'p-resv'], in: ['เข้าพักอยู่', 'p-in'], out: ['เช็กเอาท์แล้ว', 'p-out'], cancelled: ['ยกเลิก', 'p-cxl'] };
const pillStatus = s => { const x = STATUS[s] || [s, 'p-out']; return `<span class="pill ${x[1]}">${x[0]}</span>`; };
const activeRooms = () => S.rooms.filter(r => truthy(r.active));
const physical = r => r.combines ? String(r.combines).split(',').map(s => s.trim()).filter(Boolean) : [r.id];
const isLive = b => b.status === 'reserved' || b.status === 'in';

function conflictsFor(roomId, checkIn, checkOut, excludeId) {
  const r = room(roomId); if (!r) return [];
  const mine = physical(r);
  return S.bookings.filter(b => b.id !== excludeId && isLive(b) && b.checkIn < checkOut && checkIn < b.checkOut &&
    room(b.roomId) && physical(room(b.roomId)).some(x => mine.includes(x)));
}
function calcPrice(r, petCount, nights) {
  const included = Number(r.included) || 1, extraFee = Number(r.extraFee) || 0, roomRate = Number(r.price) || 0;
  const extraPets = Math.max(0, petCount - included);
  const roomAmount = roomRate * nights, extraAmount = extraPets * extraFee * nights, subtotal = roomAmount + extraAmount;
  const pn = Number(S.settings.promoNights) || 0, pp = Number(S.settings.promoPct) || 0;
  const discount = pn && nights >= pn ? Math.round(subtotal * pp) / 100 : 0;
  return { roomRate, extraPets, extraFee, roomAmount, extraAmount, subtotal, discount };
}
const VAX = { rabiesExp: 'พิษสุนัขบ้า', comboExp: 'วัคซีนรวม', kennelExp: 'ไอกรนสุนัข', fleaExp: 'ยาเห็บหมัด' };
function vaxKeys(p) { return p.species === 'cat' ? ['rabiesExp', 'comboExp', 'fleaExp'] : ['rabiesExp', 'comboExp', 'kennelExp', 'fleaExp']; }
function vaxIssues(p, until) {
  until = until || today();
  const out = [];
  vaxKeys(p).forEach(k => {
    const v = p[k];
    if (!v) out.push({ k, level: 'warn', text: VAX[k] + ': ไม่มีข้อมูล' });
    else if (v < until) out.push({ k, level: 'bad', text: VAX[k] + ': หมดอายุ ' + thDate(v) });
  });
  return out;
}
function vaxChips(p, until) {
  return '<div class="vx">' + vaxKeys(p).map(k => {
    const v = p[k];
    if (!v) return `<span class="pill p-warn">${VAX[k]} –</span>`;
    if (v < (until || today())) return `<span class="pill p-bad">${VAX[k]} หมด ${thDate(v)}</span>`;
    return `<span class="pill p-ok">${VAX[k]} ถึง ${thDate(v)}</span>`;
  }).join('') + '</div>';
}
function bookingVaxAlert(b) {
  const issues = [];
  petIdsOf(b).forEach(id => { const p = pet(id); if (p) vaxIssues(p, b.checkOut).forEach(i => issues.push({ name: p.name, ...i })); });
  if (!issues.length) return '';
  const bad = issues.some(i => i.level === 'bad');
  return `<div class="alert ${bad ? 'bad' : 'warn'}"><b>${bad ? 'วัคซีนหมดอายุ' : 'ข้อมูลวัคซีนไม่ครบ'}</b> (ยังรับเข้าพักได้)<br>${issues.map(i => esc(i.name + ' · ' + i.text)).join('<br>')}</div>`;
}

  let pin = '';
  $('#app').innerHTML = `<div class="login">
    <img src="logo.png" alt="Uhaus Pet Hotel & Grooming">
    <h2 style="font-size:18px">ใส่ PIN เพื่อเข้าใช้งาน</h2>

    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
      <button class="sm" data-n="clr">ล้าง</button><button data-n="0">0</button><button class="sm" data-n="ok">เข้าสู่ระบบ</button></div>
    <div id="lerr" class="alert bad" hidden></div></div>`;
  const dots = () => $$('#dots span').forEach((s, i) => s.classList.toggle('on', i < pin.length));
  const submit = async () => {
    if (pin.length < 4) return;
    try {
      const d = await api('login', { pin }, { text: 'กำลังเข้าสู่ระบบ…' });
      TOKEN = d.token; store('uh_token', TOKEN); S.user = d.user; await loadAll();

  });

/* ====================== Room grid ====================== */
function vRooms(main) {
  const DAYS = 14, start = S.gridStart, t = today();
  const dates = Array.from({ length: DAYS }, (_, i) => addDays(start, i));
  const rooms = activeRooms().filter(r => S.gridZone === 'all' || r.zone === S.gridZone);
  const end = addDays(start, DAYS);
  const bks = S.bookings.filter(b => b.status !== 'cancelled' && b.checkIn < end && start < b.checkOut);
  // map rowId|date -> {b, own}
  const cell = {};
  bks.forEach(b => {
    const br = room(b.roomId); if (!br) return;
    const phys = physical(br);
    S.rooms.forEach(r => {
      const own = r.id === b.roomId;
      if (!own && !physical(r).some(x => phys.includes(x))) return;
      for (let d = b.checkIn; d < b.checkOut; d = addDays(d, 1)) {
        if (d < start || d >= end) continue;
        const k = r.id + '|' + d;
        if (!cell[k] || own) cell[k] = { b, own };
      }
    });
  });
  const head = `<tr><th class="rn">ห้อง</th>${dates.map(d => `<th class="${d === t ? 'td' : ''} ${dow(d) === 0 || dow(d) === 6 ? 'wk' : ''}">${TH_D[dow(d)]}<br><b class="num">${parseISO(d).getUTCDate()}</b></th>`).join('')}</tr>`;
  let body = '';
  ZONES.forEach(z => {
    const rs = rooms.filter(r => r.zone === z); if (!rs.length) return;
    body += `<tr class="zone"><th colspan="${DAYS + 1}">${esc(ZONE_TH[z])}</th></tr>`;
    rs.forEach(r => {
      body += `<tr><th class="rn" title="${esc(r.name)}">${esc(r.name.replace(/ \(.+\)/, ''))}</th>` + dates.map(d => {
        const c = cell[r.id + '|' + d];
        if (!c) return `<td data-free="${r.id}|${d}"></td>`;
        if (!c.own) return `<td class="blk" data-cell="${c.b.id}"></td>`;
        const cls = c.b.status === 'in' ? 'b-in' : c.b.status === 'out' ? 'b-out' : 'b-resv';
        const label = (d === c.b.checkIn || d === start) ? `<span class="lb">${esc((petNames(c.b) || '').split(',')[0].slice(0, 8))}</span>` : '';
        return `<td class="${cls}" data-cell="${c.b.id}">${label}</td>`;
      }).join('') + '</tr>';
    });
  });
  main.innerHTML = `
    <div class="seg" id="zone">${[['all', 'ทั้งหมด'], ...ZONES.map(z => [z, z])].map(z => `<button data-z="${z[0]}" class="${S.gridZone === z[0] ? 'on' : ''}">${z[1]}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="iconbtn" id="prev" aria-label="ก่อนหน้า">${ICON.left}</button>
      <div style="flex:1;text-align:center;font-weight:600">${thDate(start)} – ${thDate(addDays(start, DAYS - 1))}</div>
      <button class="iconbtn" id="next" aria-label="ถัดไป">${ICON.right}</button>
      <button class="btn ghost" id="tdy" style="min-height:38px;padding:6px 12px">วันนี้</button>
    </div>
    <div class="legend"><span><i style="background:var(--resv)"></i>จองแล้ว</span><span><i style="background:var(--inhouse)"></i>เข้าพักอยู่</span><span><i style="background:var(--out)"></i>ออกแล้ว</span><span><i class="blk" style="background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 3px,var(--line) 3px,var(--line) 5px)"></i>ห้องถูกใช้รวม</span></div>
    <div class="gridwrap"><table class="occ num"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="muted small">แตะช่องว่างเพื่อจองห้องนั้น · แตะช่องที่มีสีเพื่อดูการจอง</div>
    <button class="fab" id="fab">${ICON.plus}จองห้อง</button>`;
  $$('#zone button').forEach(b => b.onclick = () => { S.gridZone = b.dataset.z; render(); });
  $('#prev').onclick = () => { S.gridStart = addDays(S.gridStart, -7); render(); };
  $('#next').onclick = () => { S.gridStart = addDays(S.gridStart, 7); render(); };
  $('#tdy').onclick = () => { S.gridStart = today(); render(); };
  $$('td[data-free]').forEach(td => td.onclick = () => { const [rid, d] = td.dataset.free.split('|'); openBookingForm({ roomId: rid, checkIn: d, checkOut: addDays(d, 1) }); });
  $$('td[data-cell]').forEach(td => td.onclick = () => openBooking(td.dataset.cell));
  $('#fab').onclick = () => openBookingForm({ checkIn: today(), checkOut: addDays(today(), 1) });
}

/* ====================== Bookings list ====================== */
function vBookings(main) {
  const t = today(), q = S.bkQ.trim().toLowerCase();
  let list = S.bookings.slice();
  if (S.bkFilter === 'upcoming') list = list.filter(b => b.status === 'reserved').sort((a, b) => a.checkIn.localeCompare(b.checkIn));
  else if (S.bkFilter === 'in') list = list.filter(b => b.status === 'in').sort((a, b) => a.checkOut.localeCompare(b.checkOut));
  else list = list.sort((a, b) => b.checkIn.localeCompare(a.checkIn));
  if (q) list = list.filter(b => ((cust(b.customerId) || {}).name + ' ' + ((cust(b.customerId) || {}).phone || '') + ' ' + petNames(b) + ' ' + ((room(b.roomId) || {}).name || '')).toLowerCase().includes(q));
  main.innerHTML = `
    <div class="seg" id="bf">${[['upcoming', 'จองล่วงหน้า'], ['in', 'เข้าพักอยู่'], ['all', 'ทั้งหมด']].map(x => `<button data-f="${x[0]}" class="${S.bkFilter === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="ค้นหาชื่อลูกค้า เบอร์ ชื่อสัตว์ หรือห้อง" value="${esc(S.bkQ)}">
    <div class="list" id="lst">${list.length ? list.slice(0, 300).map(bookingRow).join('') : '<div class="empty">ไม่มีรายการ</div>'}</div>
    <button class="fab" id="fab">${ICON.plus}จองห้อง</button>`;
  $$('#bf button').forEach(b => b.onclick = () => { S.bkFilter = b.dataset.f; render(); });

  bindRows(main);
  $('#fab').onclick = () => openBookingForm({ checkIn: t, checkOut: addDays(t, 1) });
}

/* ====================== Customers ====================== */
function custStats(cid) {
  const rcs = S.receipts.filter(r => r.customerId === cid && r.status === 'issued');
  return { visits: S.bookings.filter(b => b.customerId === cid && b.status === 'out').length, spent: rcs.reduce((n, r) => n + Number(r.total), 0) };
}
function vCustomers(main) {

/* ====================== Sheets ====================== */
const sheetStack = [];
function openSheet(title, html, onMount) {
  const host = $('#sheets');
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="ปิด">${ICON.close}</button></div><div class="bd">${html}</div></div>`;
  host.appendChild(el);
  sheetStack.push(el);
  document.body.style.overflow = 'hidden';
  el.addEventListener('click', e => { if (e.target === el) closeSheet(el); });
  $('[data-x]', el).onclick = () => closeSheet(el);
  if (onMount) onMount($('.bd', el), el);
  return el;
}
function closeSheet(el) {
  el = el || sheetStack[sheetStack.length - 1]; if (!el) return;
  el.remove(); sheetStack.splice(sheetStack.indexOf(el), 1);
  if (!sheetStack.length) document.body.style.overflow = '';
}
function closeAllSheets() { while (sheetStack.length) closeSheet(); }
function confirmBtn(btn, confirmText, fn) {
  const orig = btn.textContent; let armed = false, timer;
  btn.onclick = async () => {
    if (!armed) { armed = true; btn.textContent = confirmText; timer = setTimeout(() => { armed = false; btn.textContent = orig; }, 3500); return; }
    clearTimeout(timer);
    try { await fn(); } catch (e) { toast(e.message); armed = false; btn.textContent = orig; }
  };
}
const fv = (root, id) => { const el = $('#' + id, root); return el ? el.value.trim() : ''; };
function field(id, label, value, type = 'text', extra = '') {
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value == null ? '' : value)}" ${extra}></div>`;
}
function area(id, label, value, extra = '') { return `<div class="f"><label for="${id}">${label}</label><textarea id="${id}" ${extra}>${esc(value || '')}</textarea></div>`; }

function compressImage(file, max = 1600) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.82));
    }; img.onerror = () => rej(new Error('อ่านรูปไม่ได้')); img.src = fr.result; };
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); fr.readAsDataURL(file);
  });
}

      if (!d.customerId) { box.innerHTML = ''; return; }

      $$('input[type=checkbox]', box).forEach(c => c.onchange = () => { d.petIds = $$('input[type=checkbox]:checked', box).map(x => x.value); drawRooms(); });
      $('#b-np', box).onclick = () => openPetForm({ customerId: d.customerId }, p => { if (p) d.petIds.push(p.id); drawPets(); drawRooms(); });
    }
    function drawRooms() {
      d.checkIn = fv(bd, 'b-in'); d.checkOut = fv(bd, 'b-out');
      const sel = $('#b-room', bd);
      const species = [...new Set(d.petIds.map(id => (pet(id) || {}).species))];
      const valid = d.checkIn && d.checkOut && d.checkOut > d.checkIn;
      const n = d.petIds.length || 1;
      let html = '<option value="">– เลือกห้อง –</option>';
      ZONES.forEach(z => {
        const rs = activeRooms().filter(r => r.zone === z && (species.length !== 1 || r.species === species[0]));
        if (!rs.length) return;
        html += `<optgroup label="${esc(z)}">` + rs.map(r => {
          const busy = valid && conflictsFor(r.id, d.checkIn, d.checkOut, d.id).length;
          const over = r.maxPets !== '' && Number(r.maxPets) > 0 && n > Number(r.maxPets);
          const tag = busy ? ' · ไม่ว่าง' : over ? ` · เกิน ${r.maxPets} ตัว` : '';
          return `<option value="${r.id}" ${(busy || over) && r.id !== d.roomId ? 'disabled' : ''} ${r.id === d.roomId ? 'selected' : ''}>${esc(r.name)} · ${money(r.price)} ฿${tag}</option>`;
        }).join('') + '</optgroup>';
      });
      sel.innerHTML = html;
      if (d.roomId && !sel.value) d.roomId = '';
      drawPrice();
    }
    function drawPrice() {
      d.roomId = $('#b-room', bd).value;

      const nights = nightsBetween(d.checkIn, d.checkOut), p = calcPrice(r, d.petIds.length, nights);
      const adj = isAdmin() ? Number(fv(bd, 'b-adj')) || 0 : Number(d.adjust) || 0;
      const conflict = conflictsFor(r.id, d.checkIn, d.checkOut, d.id).length;

/* ====================== Receipt ====================== */
function bahtText(num) {
  num = Math.round((Number(num) || 0) * 100) / 100;
  const D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const rd = s => { s = String(Number(s)); if (s === '0') return ''; let out = '';
    if (s.length > 6) { out = rd(s.slice(0, -6)) + 'ล้าน'; s = s.slice(-6); }
    const n = s.length;
    for (let i = 0; i < n; i++) { const dg = +s[i], pos = n - i - 1; if (!dg) continue;
      if (pos === 0 && dg === 1 && n > 1) out += 'เอ็ด'; else if (pos === 1 && dg === 2) out += 'ยี่'; else if (pos === 1 && dg === 1) out += ''; else out += D[dg];
      out += P[pos]; }
    return out; };
  const [i, f] = num.toFixed(2).split('.');
  const bt = i === '0' ? 'ศูนย์' : rd(i);
  return bt + 'บาท' + (+f ? rd(f) + 'สตางค์' : 'ถ้วน');
}

  </div>`;

async function receiptFile(rc, kind) {
  if (!window.html2canvas) throw new Error('โหลดเครื่องมือสร้างไฟล์ไม่สำเร็จ ลองเปิดแอปใหม่');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0';
  host.innerHTML = receiptHTML(rc);
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all($$('img', host).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const canvas = await html2canvas(host.firstElementChild, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
    if (kind === 'png') {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      return new File([blob], rc.no + '.png', { type: 'image/png' });
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a5', orientation: 'portrait' });
    const pw = 148, ph = 210, m = 6;
    let w = pw - m * 2, h = canvas.height * w / canvas.width;
    if (h > ph - m * 2) { h = ph - m * 2; w = canvas.width * h / canvas.height; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w) / 2, m, w, h);
    return new File([pdf.output('blob')], rc.no + '.pdf', { type: 'application/pdf' });
  } finally { host.remove(); }
}
async function shareReceipt(rc, kind) {
  busy(true, 'กำลังสร้างไฟล์…');
  let file;
  try { file = await receiptFile(rc, kind); } catch (e) { busy(false); return toast(e.message); }
  busy(false);
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'ใบเสร็จ ' + rc.no }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = file.name; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function openReceipt(id) {

/* ---------- Reports ---------- */
function rptRange() {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  if (S.rpt === 'today') return [t, t];
  if (S.rpt === 'month') return [t.slice(0, 8) + '01', t];
  if (S.rpt === 'last') { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; const last = new Date(Date.UTC(py, pm, 0)).getUTCDate(); return [`${py}-${pad(pm)}-01`, `${py}-${pad(pm)}-${pad(last)}`]; }
  return [S.rptFrom || t.slice(0, 8) + '01', S.rptTo || t];
}
function vReports(main) {
  const [from, to] = rptRange();
  const rcs = S.receipts.filter(r => r.status === 'issued' && r.date >= from && r.date <= to).sort((a, b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const sum = k => rcs.reduce((n, r) => n + (Number(r[k]) || 0), 0);
  const total = sum('total'), byM = m => rcs.filter(r => r.method === m).reduce((n, r) => n + Number(r.total), 0);
  // occupancy: physical room-nights sold / available in range
  const phys = activeRooms().filter(r => !r.combines);
  const days = nightsBetween(from, addDays(to, 1));
  let sold = 0;
  S.bookings.filter(b => b.status !== 'cancelled').forEach(b => {
    const r = room(b.roomId); if (!r) return;
    const a = b.checkIn > from ? b.checkIn : from, e = b.checkOut < addDays(to, 1) ? b.checkOut : addDays(to, 1);
    const n = nightsBetween(a, e); if (n > 0) sold += n * physical(r).length;
  });
  const occ = phys.length && days > 0 ? Math.round(sold / (phys.length * days) * 1000) / 10 : 0;
  const daily = {};
  rcs.forEach(r => { daily[r.date] = (daily[r.date] || 0) + Number(r.total); });
  main.innerHTML = `
    <div class="seg" id="rp">${[['today', 'วันนี้'], ['month', 'เดือนนี้'], ['last', 'เดือนก่อน'], ['custom', 'กำหนดเอง']].map(x => `<button data-v="${x[0]}" class="${S.rpt === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    ${S.rpt === 'custom' ? `<div class="grid2">${field('rf', 'ตั้งแต่', from, 'date')}${field('rt', 'ถึง', to, 'date')}</div>` : `<div class="muted small">${thDateLong(from)} – ${thDateLong(to)}</div>`}
    <div class="kpis">
      <div class="kpi hero" style="grid-column:1/-1"><div class="l">รายรับสุทธิ (${rcs.length} ใบเสร็จ)</div><div class="v num">${money2(total)} <small style="color:#C6D4E6">บาท</small></div></div>
      <div class="kpi"><div class="l">ค่าห้องพัก</div><div class="v num" style="font-size:20px">${money2(sum('roomAmount'))}</div></div>
      <div class="kpi"><div class="l">ค่าตัวเพิ่ม</div><div class="v num" style="font-size:20px">${money2(sum('extraAmount'))}</div></div>
      <div class="kpi"><div class="l">ส่วนลดโปร</div><div class="v num" style="font-size:20px">−${money2(sum('discount'))}</div></div>
      <div class="kpi"><div class="l">อาบน้ำตัดขน</div><div class="v num" style="font-size:20px">${money2(sum('groomAmount'))}</div></div>
      ${sum('adjust') ? `<div class="kpi"><div class="l">ปรับยอด</div><div class="v num" style="font-size:20px">${money2(sum('adjust'))}</div></div>` : ''}
      <div class="kpi"><div class="l">รับโอน</div><div class="v num" style="font-size:20px">${money2(byM('transfer'))}</div></div>
      <div class="kpi"><div class="l">รับผ่าน QR</div><div class="v num" style="font-size:20px">${money2(byM('qr'))}</div></div>
      <div class="kpi"><div class="l">อัตราเข้าพัก</div><div class="v num" style="font-size:20px">${occ}%</div><div class="small muted">${sold} / ${phys.length * days} ห้อง-คืน</div></div>
    </div>
    <div class="sec"><h2>รายรับรายวัน</h2></div>
    <div class="list">${Object.keys(daily).length ? Object.keys(daily).sort().reverse().map(d => `<div class="row" style="cursor:default"><div class="main">${thDateLong(d)}</div><div class="end num">${money2(daily[d])}</div></div>`).join('') : '<div class="empty">ไม่มีรายรับในช่วงนี้</div>'}</div>
    <button class="btn pri full" id="csv">ส่งออกไฟล์ Excel (CSV) ของช่วงนี้</button>
    <div class="muted small">ยอดคำนวณจากใบเสร็จที่ไม่ถูกยกเลิก ตามวันที่ออกใบเสร็จ (เกณฑ์เงินสด)</div>`;
  $$('#rp button').forEach(b => b.onclick = () => { S.rpt = b.dataset.v; render(); });
  if ($('#rf')) { $('#rf').onchange = e => { S.rptFrom = e.target.value; render(); }; $('#rt').onchange = e => { S.rptTo = e.target.value; render(); }; }
  $('#csv').onclick = async () => {
    const head = ['วันที่', 'เลขที่ใบเสร็จ', 'ลูกค้า', 'ประเภท', 'ค่าห้อง', 'ค่าตัวเพิ่ม', 'ส่วนลด', 'ปรับยอด', 'อาบน้ำตัดขน', 'ยอดสุทธิ', 'ช่องทาง', 'ผู้รับเงิน'];
    const rows = rcs.map(r => [r.date, r.no, r.customerName, r.refType === 'booking' ? 'ห้องพัก' : 'อาบน้ำตัดขน', r.roomAmount, r.extraAmount, r.discount, r.adjust, r.groomAmount, r.total, r.method === 'qr' ? 'QR' : 'โอน', r.receivedBy]);
    const csv = '﻿' + [head, ...rows].map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const file = new File([csv], `Uhaus-รายรับ-${from}-${to}.csv`, { type: 'text/csv' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  };
}

    ${u.id ? `<label class="chk"><input type="checkbox" id="u-a" ${u.active ? 'checked' : ''}><span>เปิดใช้งาน</span></label>` : ''}
    <button class="btn pri full">บันทึก</button></form>`, (bd, el) => {
    $('#uf', bd).onsubmit = async e => {
      e.preventDefault();
      try { users = await api('saveUser', { id: u.id, name: fv(bd, 'u-n'), role: fv(bd, 'u-r'), pin: fv(bd, 'u-p'), active: u.id ? $('#u-a', bd).checked : true }); closeSheet(el); draw(); toast('บันทึกผู้ใช้แล้ว'); } catch (err) { toast(err.message); }
    };
  });
  draw();
}

/* ====================== Boot ====================== */
(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!API) return render();
  if (TOKEN) {
    S.user = { name: '', role: 'staff' };
    $('#app').innerHTML = '<div class="login"><img src="logo.png" alt="Uhaus"><div class="muted">กำลังโหลดข้อมูล…</div></div>';
    try { await loadAll(true); } catch (e) { if (S.user && !S.user.name) { S.user = null; } render(); toast(e.message, 4000); }
  } else render();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.user.name && !sheetStack.length) loadAll(true).catch(() => {}); });
})();
</script>
</body>
</html>
